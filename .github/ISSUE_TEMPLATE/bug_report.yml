name: Report a website issue
description: Report a problem with the site or catalogue
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Browser and device (optional)
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: false