name: Suggest a resource
description: Suggest an original prompt or reusable skill for the library
title: "[Resource]: "
labels: [resource-suggestion]
body:
  - type: dropdown
    id: type
    attributes:
      label: Resource type
      options:
        - Prompt
        - Skill
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Title
      placeholder: A concise, descriptive title
    validations:
      required: true
  - type: input
    id: category
    attributes:
      label: Category
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What does it do?
    validations:
      required: true
  - type: textarea
    id: content
    attributes:
      label: Full resource content
      description: Submit only content you have permission to share. Do not include private data.
    validations:
      required: true
  - type: dropdown
    id: difficulty
    attributes:
      label: Suggested difficulty
      options:
        - Beginner
        - Intermediate
        - Advanced
    validations:
      required: true
  - type: input
    id: collections
    attributes:
      label: Suggested collections (optional)
      description: Getting Started, Learning Lab, Project Builder, Developer Toolkit, Research & Decisions, or Writing Desk
  - type: input
    id: tags
    attributes:
      label: Tags (comma-separated)
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: This is original or I have permission to share it.
          required: true
        - label: This contains no personal or confidential information.
          required: true