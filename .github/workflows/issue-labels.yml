name: Maintain issue labels

on:
  issues:
    types: [opened, reopened, edited]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Create and apply project labels
        uses: actions/github-script@v7
        with:
          script: |
            const definitions = [
              { name: "resource-suggestion", color: "a6f06a", description: "A proposed prompt or reusable skill" },
              { name: "bug", color: "d73a4a", description: "A website or catalogue problem" },
              { name: "needs-review", color: "1d76db", description: "Awaiting maintainer review" }
            ];

            for (const label of definitions) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...label
                });
              }
            }

            const title = context.payload.issue.title || "";
            const expected = title.startsWith("[Resource]") ? "resource-suggestion"
              : title.startsWith("[Bug]") ? "bug" : "needs-review";

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [expected]
            });
